# =========================================================
# HTTP → HTTPS
# =========================================================
server {
    listen 80;
    listen [::]:80;

    server_name laravel.test;

    return 301 https://$host$request_uri;
}

# =========================================================
# HTTPS
# =========================================================
server {
    listen 443 ssl;
    listen [::]:443 ssl;

    http2 on;

    server_name laravel.test;

    root /var/www/public;
    index index.php;

    server_tokens off;
    client_max_body_size 100M;

    # SSL
    ssl_certificate     /etc/nginx/certs/laravel.crt;
    ssl_certificate_key /etc/nginx/certs/laravel.key;
    ssl_protocols TLSv1.2 TLSv1.3;
    ssl_session_cache shared:SSL:10m;
    ssl_session_timeout 1d;
    ssl_session_tickets off;

    # Security headers
    add_header X-Frame-Options "SAMEORIGIN" always;
    add_header X-Content-Type-Options "nosniff" always;
    add_header Referrer-Policy "strict-origin-when-cross-origin" always;
    add_header X-XSS-Protection "0" always;

    # Vite dev server
    location ~ ^/(?:@vite|__laravel_vite_plugin__|node_modules|resources|vendor|@id|@fs)/ {
        proxy_pass https://vite:5173;
        proxy_http_version 1.1;

        proxy_set_header Host $host;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_redirect off;
    }

    # Vite HMR websocket
    location /_vite_hmr {
        proxy_pass https://vite:5173;
        proxy_http_version 1.1;

        proxy_set_header Upgrade $http_upgrade;
        proxy_set_header Connection "upgrade";
        proxy_set_header Host $host;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Host $host;
        proxy_set_header X-Real-IP $remote_addr;
    }

    # Laravel app
    location / {
        try_files $uri $uri/ /index.php?$query_string;
    }

    location ~ ^/livewire-[a-f0-9]+/ {
        try_files $uri $uri/ /index.php?$query_string;
    }

    # PHP
    location ~ \.php$ {
        try_files $uri =404;

        include fastcgi_params;

        fastcgi_pass app:9000;
        fastcgi_index index.php;
        fastcgi_param SCRIPT_FILENAME $document_root$fastcgi_script_name;
        fastcgi_param DOCUMENT_ROOT $document_root;
        fastcgi_param HTTP_PROXY "";
        fastcgi_param HTTPS on;
        fastcgi_param SERVER_PORT 443;

        fastcgi_buffer_size 128k;
        fastcgi_buffers 4 256k;
        fastcgi_busy_buffers_size 256k;
        fastcgi_read_timeout 300s;
        fastcgi_send_timeout 300s;
    }

    location ~ /\.(?!well-known).* {
        deny all;
        access_log off;
        log_not_found off;
    }

    location ~* ^/(?:storage|uploads)/.*\.php$ {
        deny all;
    }

    location ~* \.(?:css|js|mjs|map|jpg|jpeg|png|gif|svg|ico|webp|avif|woff|woff2|ttf|otf)$ {
        expires 7d;
        add_header Cache-Control "public, max-age=604800" always;
        access_log off;
        try_files $uri =404;
    }

    location = /favicon.ico {
        log_not_found off;
        access_log off;
    }

    location = /robots.txt {
        log_not_found off;
        access_log off;
    }
}

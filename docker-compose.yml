services:
    app:
        build:
            context: ./docker/php
            dockerfile: Dockerfile
        container_name: app
        working_dir: /var/www
        volumes:
            - .:/var/www
            - node_modules:/var/www/node_modules
        ports:
            - "9000:9000"
        depends_on:
            vite:
                condition: service_started
            db_mysql:
                condition: service_healthy
        networks:
            - network_laravel

    vite:
        image: node:22-alpine
        container_name: vite
        working_dir: /var/www
        command: sh -lc "npm install && npm run dev -- --host 0.0.0.0"
        ports:
            - "5173:5173"
        volumes:
            - .:/var/www
            - node_modules:/var/www/node_modules
        networks:
            - network_laravel

    webserver:
        image: nginx:1.31.5-alpine
        container_name: webserver
        ports:
            - "80:80"
            - "443:443"
        volumes:
            - .:/var/www
            - ./docker/nginx/default.conf:/etc/nginx/conf.d/default.conf:ro
            - ./docker/nginx/certs:/etc/nginx/certs:ro
        depends_on:
            app:
                condition: service_started
        networks:
            - network_laravel

    db_mysql:
        image: mysql:8.4.11
        container_name: db_mysql
        environment:
            MYSQL_ROOT_PASSWORD: ${MYSQL_ROOT_PASSWORD:-root}
            MYSQL_DATABASE: ${DB_DATABASE:-laravel}
            MYSQL_USER: ${DB_USERNAME:-laravel}
            MYSQL_PASSWORD: ${DB_PASSWORD:-laravel}
        ports:
            - "${DB_PORT:-3306}:3306"
        volumes:
            - database_mysql:/var/lib/mysql
            - ./docker/mysql/my.cnf:/etc/mysql/conf.d/my.cnf:ro
        healthcheck:
            test: ["CMD", "mysqladmin", "ping", "-h", "localhost", "-uroot", "-p$$MYSQL_ROOT_PASSWORD:-root"]
            interval: 10s
            timeout: 5s
            retries: 10
            start_period: 20s
        networks:
            - network_laravel

    mail:
        image: axllent/mailpit:latest
        container_name: mail
        ports:
            - "8025:8025"
            - "1025:1025"
        networks:
            - network_laravel

networks:
    network_laravel:
        driver: bridge

volumes:
    database_mysql:
        driver: local
    node_modules:
        driver: local
